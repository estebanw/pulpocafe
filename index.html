<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulpo - Café y Cultura</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            /* 1. Usamos exactamente el color crema texturizado de tu referencia */
            background-color: #f2efe6; 
            background-image: url('https://www.transparenttextures.com/patterns/p6.png'); /* Textura de papel sutil */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; /* Alinea al principio */
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .contenedor-principal {
            /* Este contenedor engloba todo para asegurar el centrado */
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 600px; /* Ancho máximo para que no se estire demasiado */
        }

        .imagen-referencia {
            /* 2. Mostramos la imagen de referencia EXACTA */
            width: 100%;
            height: auto;
            display: block;
            /* Pequeña sombra para dar efecto de papel sobre la mesa */
            box-shadow: 0 10px 20px rgba(0,0,0,0.05); 
            border-radius: 2px; /* Bordes muy ligeramente suavizados */
        }

        .footer-menu {
            /* 3. Estilos para el texto inferior (Café Filtrado...) */
            margin-top: 20px;
            text-align: center;
            font-family: 'Montserrat', sans-serif;
            color: #1a1a1a;
            width: 100%;
        }

        .footer-label {
            display: block;
            font-weight: 700;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .footer-texto {
            display: block;
            font-size: 1.1rem;
            font-weight: 400;
        }

        /* Responsive para móviles */
        @media (max-width: 600px) {
            body { padding: 10px; }
            .imagen-referencia { width: 100%; }
            .footer-texto { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <div class="contenedor-principal">
        <img src="pulpo-referencia.png" alt="Diseño Pulpo Café Cultura" class="imagen-referencia">

        <div class="footer-menu">
            <span class="footer-label">NUESTRO BÁSICO:</span>
            <span class="footer-texto">Café Filtrado y Tostado Clásico</span>
        </div>
    </div>

</body>
</html>
