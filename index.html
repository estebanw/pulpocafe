<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulpo - Café y Cultura</title>
    <link href="https://fonts.googleapis.com/css2?family=Indie+Flower&family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #f2efe6; /* Color crema del fondo */
            background-image: url('https://www.transparenttextures.com/patterns/felt.png'); /* Textura sutil */
            font-family: 'Open Sans', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            color: #1a1a1a;
            text-align: center;
        }

        .logo-container { margin-bottom: 20px; }
        .logo-img { width: 100px; height: auto; }
        
        h1 { 
            font-family: 'Open Sans', sans-serif;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin: 10px 0;
        }

        .categories {
            display: flex;
            gap: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 2rem;
            text-transform: uppercase;
            font-weight: 800;
            margin-bottom: 30px;
        }

        .events-grid {
            display: flex;
            gap: 20px;
            max-width: 600px;
        }

        .event-card {
            border: 2px solid #000;
            padding: 20px;
            border-radius: 5px;
            flex: 1;
            background: rgba(255, 255, 255, 0.3);
            /* Este efecto simula el dibujo a mano */
            border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
            position: relative;
        }

        .event-card h3 { font-family: 'Indie+Flower', cursive; margin: 0; }
        
        .footer-note {
            margin-top: 40px;
            font-size: 1.1rem;
        }

        .footer-note span { display: block; font-weight: bold; text-transform: uppercase; font-size: 0.8rem; }
    </style>
</head>
<body>

    <div class="logo-container">
        <img src="logo-pulpo.png" alt="Pulpo" class="logo-img">
        <h1>PULPO</h1>
    </div>

    <div class="categories">
        <span>CAFÉ ☕</span>
        <span>CULTURA 📖</span>
        <span>SAN FERNANDO 〰️</span>
    </div>

    <div class="section-title">ESTA SEMANA</div>

    <div class="events-grid">
        <div class="event-card">
            <p><strong>SÁBADO 11hs:</strong></p>
            <h3>Taller de Barro para Chicos 🖐️</h3>
        </div>
        <div class="event-card">
            <p><strong>DOMINGO 18hs:</strong></p>
            <h3>Poesía y Música Acústica 🎸</h3>
        </div>
    </div>

    <div class="footer-note">
        <span>NUESTRO BÁSICO:</span>
        Café Filtrado y Tostado Clásico
    </div>

</body>
</html>
