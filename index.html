<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulpo - Café y Cultura</title>
    <link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Montserrat:wght@400;700&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
    <style>
        body {
            /* Color crema/papel del original */
            background-color: #edeae0; 
            /* Textura de papel sutil */
            background-image: url('https://www.transparenttextures.com/patterns/paper-fibers.png');
            font-family: 'Montserrat', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px 20px;
            color: #1a1a1a;
            margin: 0;
        }

        .logo-pulpo {
            width: 120px;
            height: auto;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 2.5rem;
            letter-spacing: 5px;
            margin: 0 0 30px 0;
            font-weight: 700;
        }

        .nav {
            font-size: 0.8rem;
            font-weight: 700;
            display: flex;
            gap: 15px;
            margin-bottom: 50px;
            letter-spacing: 1px;
        }

        .nav span { border-bottom: 2px solid transparent; }
        /* Efecto de la rayita debajo de San Fernando */
        .san-fernando { border-bottom: 2px solid #333 !important; padding-bottom: 2px; }

        .titulo-semana {
            font-size: 2.2rem;
            font-weight: 900;
            margin-bottom: 40px;
            letter-spacing: 2px;
        }

        .contenedor-eventos {
            display: flex;
            gap: 30px;
            max-width: 800px;
            width: 100%;
            justify-content: center;
        }

        .card {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid #1a1a1a;
            padding: 30px 20px;
            width: 280px;
            text-align: center;
            /* Bordes irregulares para efecto dibujo a mano */
            border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
            box-shadow: 2px 5px 10px rgba(0,0,0,0.05);
        }

        .card p {
            font-weight: 700;
            margin: 0 0 15px 0;
            font-size: 1.1rem;
        }

        .card h3 {
            font-family: 'Gochi Hand', cursive;
            font-size: 1.8rem;
            font-weight: 400;
            margin: 0;
            line-height: 1.2;
        }

        .footer {
            margin-top: 60px;
            text-align: center;
        }

        .footer .label {
            font-weight: 800;
            font-size: 0.75rem;
            display: block;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .footer .texto {
            font-size: 1.3rem;
            font-family: 'Montserrat', sans-serif;
        }

        /* Responsive para móviles */
        @media (max-width: 600px) {
            .contenedor-eventos { flex-direction: column; align-items: center; }
        }
    </style>
</head>
<body>

    <img src="logo-pulpo.png" alt="Logo Pulpo" class="logo-pulpo">
    <h1>PULPO</h1>

    <div class="nav">
        <span>CAFÉ ☕</span>
        <span>CULTURA 📖</span>
        <span class="san-fernando">SAN FERNANDO</span>
    </div>

    <div class="titulo-semana">ESTA SEMANA</div>

    <div class="contenedor-eventos">
        <div class="card">
            <p>SÁBADO 11hs:</p>
            <h3>Taller de Barro para Chicos 🖐️</h3>
        </div>

        <div class="card">
            <p>DOMINGO 18hs:</p>
            <h3>Poesía y Música Acústica 🎸</h3>
        </div>
    </div>

    <div class="footer">
        <span class="label">NUESTRO BÁSICO:</span>
        <span class="texto">Café Filtrado y Tostado Clásico</span>
    </div>

</body>
</html>
