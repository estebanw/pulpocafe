<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PULPO Fanzine - San Fernando</title>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Cormorant+Garamond:wght@300&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Colores de la imagen: Hueso moteado y Negro tinta */
            --color-papel: #f3f0e8;
            --color-tinta: #1a1a1a;
        }

        body {
            /* Textura moteada del papel directamente con CSS */
            background-color: var(--color-papel);
            background-image: radial-gradient(rgba(0,0,0,0.1) 1px, transparent 1px);
            background-size: 20px 20px;
            
            color: var(--color-tinta);
            font-family: 'Cormorant Garamond', serif; /* Fina y elegante */
            margin: 0;
            padding: 0;
            line-height: 1.4;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Contenedor principal que imita la tablet */
        .pantalla-fanzine {
            width: 90%;
            max-width: 600px; /* Tamaño similar a una tablet */
            margin-top: 50px;
            padding: 40px;
            border: 2px solid var(--color-tinta); /* Borde de la pantalla */
            border-radius: 10px;
            background-color: var(--color-papel);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            width: 100px;
            margin-bottom: 20px;
        }

        .titulo-pulpo {
            font-family: 'Special+Elite', cursive;
            font-size: 2.2rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        nav.menu {
            display: flex;
            justify-content: space-around;
            max-width: 80%;
            margin: 20px auto 0;
            font-family: 'Special+Elite', cursive;
            font-size: 0.9rem;
            opacity: 0.8;
        }

        section.agenda-semana {
            margin-bottom: 40px;
        }

        .titulo-esta-semana {
            font-family: 'Special+Elite', cursive;
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 30px;
            text-transform: uppercase;
        }

        .grilla-eventos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        /* --- AQUÍ ESTÁ EL TRUCO DE LOS MARCOS DIBUJADOS --- */
        .evento {
            background-color: var(--color-papel);
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        /* Esto crea el borde irregular dibujado a mano */
        .evento::before {
            content: "";
            position: absolute;
            top: -5px;
            left: -5px;
            right: -5px;
            bottom: -5px;
            border: 1px solid var(--color-tinta);
            z-index: -1;
            /* Estos valores crean el efecto de línea irregular */
            border-radius: 4px;
            transform: skewX(-0.5deg) skewY(0.5deg);
        }

        /* Añadimos iconos CSS simples para barro y música */
        .icono-evento {
            display: inline-block;
            width: 20px;
            height: 20px;
            margin-right: 10px;
            vertical-align: middle;
        }

        .barro::before { content: "🖐️"; }
        .musica::before { content: "🎸"; }

        .evento strong {
            font-family: 'Special+Elite', cursive;
            display: block;
            margin-bottom: 5px;
        }

        footer {
            text-align: center;
            font-size: 0.9rem;
            padding-top: 20px;
            border-top: 1px solid rgba(0,0,0,0.2);
            font-family: 'Cormorant Garamond', serif;
        }

        @media (max-width: 600px) {
            .pantalla-fanzine {
                width: 95%;
                padding: 20px;
                margin-top: 20px;
            }
            .titulo-pulpo { font-size: 1.8rem; }
            nav.menu { flex-direction: column; gap: 5px; }
        }
    </style>
</head>
<body>

    <div class="pantalla-fanzine">
        <header>
            <img src="logo.png" alt="PULPO Fanzine" class="logo">
            <h1 class="titulo-pulpo">PULPO</h1>
            <nav class="menu">
                <span>CAFÉ ☕</span>
                <span>CULTURA 📖</span>
                <span>SAN FERNANDO 〰️</span>
            </nav>
        </header>

        <section class="agenda-semana">
            <h2 class="titulo-esta-semana">ESTA SEMANA</h2>
            <div class="grilla-eventos">
                <div class="evento">
                    <span class="icono-evento barro"></span>
                    <strong>SÁBADO 11hs:</strong>
                    <p>Taller de Barro para Chicos (Traer ropa para ensuciar)</p>
                </div>
                <div class="evento">
                    <span class="icono-evento musica"></span>
                    <strong>DOMINGO 18hs:</strong>
                    <p>Poesía y Música Acústica al Atardecer.</p>
                </div>
            </div>
        </section>

        <footer>
            <p>NUESTRO BÁSICO:<br>
            <span style="font-family: 'Special+Elite', cursive; font-size: 0.8rem;">Café Filtrado y Tostado Clásico • Pastelería casera</span></p>
            <p style="opacity: 0.6; margin-top: 20px;">📍 San Fernando, Buenos Aires</p>
        </footer>
    </div>

</body>
</html>
